<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── Init Firebase ──────────────────────────────────────────────────────────
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const PUB_REF   = () => ref(db, "golf/published");
const DRAFT_REF = () => ref(db, "golf/draft");

// ── App State ──────────────────────────────────────────────────────────────
let pubData   = null;   // published (what players see)
let draftData = null;   // admin draft
let isDirty   = false;
let currentView = "loading";
let myIdx     = null;
let rankMode  = "total";
let editingHole = null;
let adminCell   = null; // {pi, hi}
let pollTimer   = null;

const DEFAULT_PAR = Array(18).fill(4);

// ── Score helpers ──────────────────────────────────────────────────────────
function totalStrokes(strokes) {
  return strokes.reduce((s, v) => s + (parseInt(v) || 0), 0);
}
function netScore(strokes, handicap) {
  const t = totalStrokes(strokes);
  return t > 0 ? t - (parseInt(handicap) || 0) : 0;
}

// ── New New Peoria ─────────────────────────────────────────────────────────
function seededRng(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
}
function drawHoles(par) {
  const seed = par.reduce((acc, p, i) => acc + p * (i + 1) * 31, 0);
  const rng = seededRng(seed);
  const idx = [...Array(18)].map((_, i) => i);
  for (let i = 17; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return new Set(idx.slice(0, 6));
}
function cappedStroke(s, par) {
  return Math.min(s, par <= 3 ? 5 : par === 4 ? 7 : 9);
}
function nnpScore(strokes, par) {
  if (!strokes.every(s => s !== "" && parseInt(s) > 0)) return null;
  const excl  = drawHoles(par);
  const parAll = par.reduce((a, b) => a + b, 0);
  let sum12 = 0;
  for (let i = 0; i < 18; i++) {
    if (excl.has(i)) continue;
    sum12 += cappedStroke(parseInt(strokes[i]) || 0, par[i]);
  }
  const gross18  = totalStrokes(strokes);
  const handicap = Math.round((sum12 * 1.5 - parAll) * 0.8);
  return { net: gross18 - handicap, handicap, excluded: [...excl].sort((a,b)=>a-b) };
}

// ── Firebase read/write ────────────────────────────────────────────────────
async function readRef(r) {
  try { const snap = await get(r); return snap.exists() ? snap.val() : null; }
  catch { return null; }
}
async function writeRef(r, data) {
  try { await set(r, data); return true; } catch { return false; }
}

// ── Poll ───────────────────────────────────────────────────────────────────
function startPoll() {
  stopPoll();
  const ms = currentView === "player" ? 10000 : 30000;
  pollTimer = setInterval(async () => {
    const data = await readRef(PUB_REF());
    if (data) {
      pubData = data;
      if (currentView === "player") renderPlayerView();
      if (currentView === "ranking") renderRanking();
      if (currentView === "admin") {
        // Merge latest strokes into draft silently
        if (draftData) {
          draftData.players = draftData.players.map((dp, i) => {
            const pp = data.players?.[i];
            return pp ? { ...dp, strokes: pp.strokes } : dp;
          });
        }
        renderAdminScorecard();
      }
    }
  }, ms);
}
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// ── Load published on boot ─────────────────────────────────────────────────
async function boot() {
  pubData = await readRef(PUB_REF());
  showView("home");
}

// ── View switching ─────────────────────────────────────────────────────────
window.showView = function(v) {
  stopPoll();
  currentView = v;
  document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add("hidden"));
  document.getElementById("view-" + v)?.classList.remove("hidden");
  if (v === "home")        renderHome();
  if (v === "ranking")   { renderRanking(); startPoll(); }
  if (v === "player")    { renderPlayerView(); startPoll(); }
  if (v === "admin")     { renderAdmin(); startPoll(); }
  if (v === "playerSelect") renderPlayerSelect();
};

// ── HOME ───────────────────────────────────────────────────────────────────
function renderHome() {
  const banner = document.getElementById("home-banner");
  if (pubData) {
    banner.classList.remove("hidden");
    banner.innerHTML = [
      pubData.matchDate  ? `<span>📅 ${pubData.matchDate}</span>`  : "",
      pubData.courseName ? `<span>🏌️ ${pubData.courseName}</span>` : "",
      pubData.teamName   ? `<span>👥 ${pubData.teamName}</span>`   : "",
    ].join("");
  }
}

window.showPin  = function() { document.getElementById("pin-box").classList.remove("hidden"); document.getElementById("pin-input").focus(); };
window.hidePin  = function() { document.getElementById("pin-box").classList.add("hidden"); document.getElementById("pin-input").value = ""; };
window.checkPin = function() {
  const v = document.getElementById("pin-input").value;
  if (v === ADMIN_PIN) { hidePin(); enterAdmin(); }
  else { alert("密碼錯誤"); document.getElementById("pin-input").value = ""; }
};
window.goPlayerSelect = function() {
  if (!pubData) { alert("請先由管理員建立比賽！"); return; }
  showView("playerSelect");
};

// ── PLAYER SELECT ──────────────────────────────────────────────────────────
function renderPlayerSelect() {
  const grid = document.getElementById("player-chips");
  grid.innerHTML = pubData.players.map((p, i) =>
    `<div class="chip" onclick="selectPlayer(${i})">${p.name}</div>`
  ).join("");
}
window.selectPlayer = function(i) { myIdx = i; showView("player"); };

// ── PLAYER SCORING ─────────────────────────────────────────────────────────
function renderPlayerView() {
  if (!pubData || myIdx === null) return;
  const me = pubData.players[myIdx];
  const t  = totalStrokes(me.strokes);
  const parT = pubData.par.reduce((a,b)=>a+b,0);
  const diff = t > 0 ? t - parT : null;
  const f9 = me.strokes.slice(0,9).reduce((s,v)=>s+(parseInt(v)||0),0);
  const b9 = me.strokes.slice(9).reduce((s,v)=>s+(parseInt(v)||0),0);

  document.getElementById("my-avatar").textContent = me.name[0];
  document.getElementById("my-name").textContent = me.name;
  document.getElementById("my-stats").innerHTML = `
    <span class="stat-chip">總桿 ${t||"—"}</span>
    <span class="stat-chip" style="color:#27ae60">淨桿 ${t>0?netScore(me.strokes,me.handicap):"—"}</span>
    ${diff!==null?`<span class="stat-chip" style="color:${diff>0?"#c0392b":"#27ae60"}">${diff>0?"+"+diff:diff} vs Par</span>`:""}
  `;
  document.getElementById("front9-lbl").textContent = `前九洞（${f9||0} 桿）`;
  document.getElementById("back9-lbl").textContent  = `後九洞（${b9||0} 桿）`;
  document.getElementById("front9-grid").innerHTML = me.strokes.slice(0,9).map((s,i)=>holeBtn(i,s,pubData.par[i])).join("");
  document.getElementById("back9-grid").innerHTML  = me.strokes.slice(9).map((s,i)=>holeBtn(i+9,s,pubData.par[i+9])).join("");
}
function holeBtn(hi, stroke, par) {
  const s = parseInt(stroke), d = s && par ? s - par : null;
  const colors = holeColors(d);
  const lbl = d===null?"":d<=-2?"Eagle":d===-1?"Birdie":d===0?"Par":d===1?"Bogey":d===2?"Double":`+${d}`;
  return `<div class="hole-btn" style="background:${colors.bg};border-color:${colors.border}" onclick="openHoleModal(${hi})">
    <div class="hole-num">${hi+1}</div>
    <div class="hole-par-lbl">P${par}</div>
    <div class="hole-score" style="color:${colors.text}">${stroke!==""&&stroke!==undefined?stroke:"·"}</div>
    ${d!==null?`<div class="hole-label" style="color:${colors.text}">${lbl}</div>`:""}
  </div>`;
}
function holeColors(d) {
  if (d===null) return {bg:"#f1f5f9",border:"#e2e8f0",text:"#64748b"};
  if (d<=-2)   return {bg:"#fef9c3",border:"#eab308",text:"#713f12"};
  if (d===-1)  return {bg:"#dcfce7",border:"#4ade80",text:"#166534"};
  if (d===0)   return {bg:"#dbeafe",border:"#60a5fa",text:"#1e3a8a"};
  if (d===1)   return {bg:"#fee2e2",border:"#f87171",text:"#991b1b"};
  return              {bg:"#fecaca",border:"#f87171",text:"#991b1b"};
}

// Hole modal
window.openHoleModal = function(hi) {
  if (!pubData || myIdx===null) return;
  editingHole = hi;
  const par = pubData.par[hi];
  document.getElementById("modal-title").innerHTML =
    `第 ${hi+1} 洞 <span style="font-size:13px;color:#888;font-weight:400">Par ${par}</span>`;
  document.getElementById("modal-input").value = pubData.players[myIdx].strokes[hi] || "";
  const labels = {"-2":"Eagle","-1":"Birdie","0":"Par","1":"Bogey","2":"Double","3":"Triple"};
  document.getElementById("modal-quick").innerHTML = [-2,-1,0,1,2,3].map(d => {
    const v = par + d;
    const c = d<0?"#e8f9ee":d===0?"#dbeafe":"#fee2e2";
    const bc= d<0?"#52b788":d===0?"#3b82f6":"#dc3545";
    const tc= d<0?"#155724":d===0?"#1e3a8a":"#721c24";
    return `<button class="quick-btn" style="background:${c};border-color:${bc};color:${tc}"
      onclick="setHoleVal(${v})"><div style="font-size:10px;font-weight:700">${labels[String(d)]||"+"+d}</div><div style="font-size:17px;font-weight:800">${v}</div></button>`;
  }).join("");
  document.getElementById("hole-modal").classList.remove("hidden");
  setTimeout(()=>document.getElementById("modal-input").focus(),50);
};
window.setHoleVal = function(v) { document.getElementById("modal-input").value = v; };
window.closeHoleModal = function() { document.getElementById("hole-modal").classList.add("hidden"); editingHole = null; };
window.confirmHole = async function() {
  if (editingHole === null || !pubData || myIdx === null) return;
  const val = document.getElementById("modal-input").value;
  pubData.players[myIdx].strokes[editingHole] = val;
  closeHoleModal();
  renderPlayerView();
  setPlayerStatus("💾 同步中...", "#e67e22");
  await writeRef(PUB_REF(), pubData);
  setPlayerStatus("✅ 已同步 " + new Date().toLocaleTimeString("zh-TW"), "#27ae60");
};
function setPlayerStatus(msg, color) {
  const el = document.getElementById("player-status");
  el.textContent = msg; el.style.color = color;
}

// ── RANKING ────────────────────────────────────────────────────────────────
async function loadPub() {
  const data = await readRef(PUB_REF());
  if (data) pubData = data;
  if (currentView==="ranking") renderRanking();
  if (currentView==="admin") { draftData = pubData ? JSON.parse(JSON.stringify(pubData)) : draftData; renderAdmin(); }
}
window.loadPub = loadPub;

window.setRankMode = function(m) {
  rankMode = m;
  ["total","net","nnp"].forEach(x => {
    document.getElementById("rb-"+x).className = x===m ? "btn-green" : "btn-gray";
  });
  renderRanking();
};

function renderRanking() {
  if (!pubData) return;
  // Banner
  const rb = document.getElementById("rank-banner");
  rb.classList.remove("hidden");
  rb.innerHTML = [
    pubData.matchDate  ? `<span>📅 ${pubData.matchDate}</span>`  : "",
    pubData.courseName ? `<span>🏌️ ${pubData.courseName}</span>` : "",
  ].join("");

  // NNP info
  const nnpInfo = document.getElementById("nnp-info");
  if (rankMode==="nnp") {
    const excl = [...drawHoles(pubData.par)].sort((a,b)=>a-b).map(i=>i+1);
    nnpInfo.classList.remove("hidden");
    nnpInfo.innerHTML = `<strong>抽洞結果（不計入成績）：</strong>第 ${excl.join("、")} 洞
      <div style="font-size:11px;color:#9333ea;margin-top:3px">Par3 最高5桿・Par4 最高7桿・Par5 最高9桿（2.3.4制度）</div>`;
  } else { nnpInfo.classList.add("hidden"); }

  // Build & sort
  const list = pubData.players.map((p,i) => ({
    ...p, i,
    total: totalStrokes(p.strokes),
    net:   netScore(p.strokes, p.handicap),
    nnp:   nnpScore(p.strokes, pubData.par),
  })).filter(p => p.total > 0).sort((a,b) =>
    rankMode==="total" ? a.total-b.total :
    rankMode==="net"   ? a.net-b.net :
    (a.nnp?.net??9999)-(b.nnp?.net??9999)
  );

  const medals = ["🥇","🥈","🥉"];
  document.getElementById("rank-list").innerHTML = list.length === 0
    ? `<p style="color:#aaa;text-align:center;padding:24px">尚未有成績</p>`
    : list.map((p, rank) => {
      const score = rankMode==="total"?p.total:rankMode==="net"?p.net:p.nnp?.net??"-";
      const scoreColor = rankMode==="total"?"#2563eb":rankMode==="net"?"#27ae60":"#7c3aed";
      const detail = `總桿 ${p.total} · 差點 ${p.handicap} · 淨桿 ${p.net}`
        + (p.nnp?` · 新新差點 ${p.nnp.handicap} · 新新淨桿 ${p.nnp.net}`:"");
      return `<div class="rank-row" style="background:${rank===0?"#fffbe6":rank===1?"#f7f7f7":"#fff"}">
        <span style="font-size:24px;min-width:32px">${medals[rank]||rank+1}</span>
        <span class="rank-avatar">${p.name[0]}</span>
        <div style="flex:1">
          <div style="font-weight:700;font-size:16px">${p.name}</div>
          <div style="font-size:12px;color:#888;margin-top:2px">${detail}</div>
        </div>
        <div class="rank-score" style="color:${scoreColor}">${score}</div>
      </div>`;
    }).join("");
}

// ── ADMIN ──────────────────────────────────────────────────────────────────
async function enterAdmin() {
  showView("loading");
  let d = await readRef(DRAFT_REF());
  if (!d) d = pubData ? JSON.parse(JSON.stringify(pubData))
    : { matchDate: new Date().toLocaleDateString("zh-TW"), teamName:"", courseName:"", par:[...DEFAULT_PAR], players:initPlayers() };
  draftData = d;
  isDirty = false;
  showView("admin");
}

function initPlayers(n=8) {
  return Array.from({length:n},(_,i)=>({id:`p-${Date.now()}-${i}`,name:`球友${i+1}`,strokes:Array(18).fill(""),handicap:0}));
}

function renderAdmin() {
  if (!draftData) return;
  document.getElementById("a-date").value   = draftData.matchDate  || "";
  document.getElementById("a-team").value   = draftData.teamName   || "";
  document.getElementById("a-course").value = draftData.courseName || "";
  renderParTable();
  renderPlayerList();
  renderAdminScorecard();
  setDirtyUI();
}

function renderParTable() {
  const parT = draftData.par.reduce((a,b)=>a+b,0);
  document.getElementById("par-lbl").textContent = `標準桿（合計 ${parT}）`;
  document.getElementById("par-table").innerHTML = `
    <thead><tr>${draftData.par.map((_,i)=>`<th>${i+1}</th>`).join("")}</tr></thead>
    <tbody><tr>${draftData.par.map((p,i)=>
      `<td><input class="par-inp" type="number" min="3" max="6" value="${p}" oninput="updatePar(${i},this.value)"></td>`
    ).join("")}</tr></tbody>`;
}

function renderPlayerList() {
  document.getElementById("player-list").innerHTML = draftData.players.map((p,i)=>`
    <div class="p-row">
      <span class="mini-avatar">${p.name[0]}</span>
      <input class="field-inp" style="flex:1" value="${p.name}" oninput="updatePlayerName(${i},this.value)" placeholder="名稱">
      <label style="font-size:13px;color:#666">差點</label>
      <input class="field-inp" style="width:54px" type="number" value="${p.handicap}" oninput="updateHandicap(${i},this.value)">
      <button class="del-btn" onclick="delPlayer(${i})">✕</button>
    </div>`).join("");
}

function renderAdminScorecard() {
  if (!draftData) return;
  const parT = draftData.par.reduce((a,b)=>a+b,0);
  const header = `<tr>
    <th style="min-width:68px">球友</th>
    ${[...Array(18)].map((_,i)=>`<th>${i+1}</th>`).join("")}
    <th>總桿</th><th>差點</th><th>淨桿</th><th>新新貝利亞</th>
  </tr>`;
  const parRow = `<tr style="background:#fffbe6">
    <td style="font-weight:700">標準桿</td>
    ${draftData.par.map(p=>`<td>${p}</td>`).join("")}
    <td style="font-weight:700">${parT}</td><td></td><td></td><td></td>
  </tr>`;
  const rows = draftData.players.map((p,pi)=>{
    const t   = totalStrokes(p.strokes);
    const n   = netScore(p.strokes, p.handicap);
    const nnp = nnpScore(p.strokes, draftData.par);
    const cells = p.strokes.map((s,hi)=>{
      const sv=parseInt(s),pv=draftData.par[hi],d=sv&&pv?sv-pv:null;
      const bg=d===null?"":d<0?"#e8f9ee":d===0?"#dbeafe":d===1?"#fee2e2":"#fecaca";
      const tc=d<0?"#155724":d>0?"#991b1b":"#1e3a8a";
      return `<td class="editable-cell" style="background:${bg}" onclick="startCellEdit(${pi},${hi})">
        <span style="font-weight:${s?600:400};color:${s?tc:"#ddd"}">${s||"—"}</span></td>`;
    }).join("");
    return `<tr>
      <td style="font-weight:600;white-space:nowrap">${p.name}</td>
      ${cells}
      <td style="color:#2563eb;font-weight:700">${t||""}</td>
      <td>${p.handicap}</td>
      <td style="color:#27ae60;font-weight:700">${t>0?n:""}</td>
      <td style="color:#7c3aed;font-weight:700">${nnp!=null?`${nnp.net}（差點${nnp.handicap}）`:""}</td>
    </tr>`;
  }).join("");
  document.getElementById("score-table").innerHTML = `<thead>${header}</thead><tbody>${parRow}${rows}</tbody>`;
}

// Admin cell edit (inline)
window.startCellEdit = function(pi, hi) {
  adminCell = {pi, hi};
  const td = document.querySelectorAll("#score-table tbody tr")[pi+1]?.querySelectorAll("td")[hi+1];
  if (!td) return;
  const cur = draftData.players[pi].strokes[hi] || "";
  td.innerHTML = `<input class="cell-inp" type="number" min="1" max="20" value="${cur}"
    onblur="commitCell(${pi},${hi},this.value)"
    onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){adminCell=null;renderAdminScorecard();}" autofocus>`;
  td.querySelector("input").focus();
};
window.commitCell = function(pi, hi, val) {
  if (!adminCell) return;
  adminCell = null;
  draftData.players[pi].strokes[hi] = val;
  saveDraftLocal();
  renderAdminScorecard();
};

// Admin helpers
window.draftMeta        = (k,v) => { draftData[k]=v; saveDraftLocal(); };
window.updatePar        = (i,v) => { draftData.par[i]=parseInt(v)||0; renderParTable(); renderAdminScorecard(); saveDraftLocal(); };
window.updatePlayerName = (i,v) => { draftData.players[i].name=v; saveDraftLocal(); };
window.updateHandicap   = (i,v) => { draftData.players[i].handicap=parseInt(v)||0; saveDraftLocal(); renderAdminScorecard(); };
window.addPlayer        = ()    => {
  const n=draftData.players.length+1;
  draftData.players.push({id:`p-${Date.now()}`,name:`球友${n}`,strokes:Array(18).fill(""),handicap:0});
  renderPlayerList(); renderAdminScorecard(); saveDraftLocal();
};
window.delPlayer = (i) => {
  if (!confirm(`確定刪除 ${draftData.players[i].name}？`)) return;
  draftData.players.splice(i,1); renderPlayerList(); renderAdminScorecard(); saveDraftLocal();
};
window.resetGame = async () => {
  if (!confirm("確定清除所有資料、開始新比賽？")) return;
  const fresh = { matchDate:new Date().toLocaleDateString("zh-TW"), teamName:"", courseName:"", par:[...DEFAULT_PAR], players:initPlayers() };
  draftData = fresh; isDirty=false;
  await writeRef(PUB_REF(), fresh);
  await writeRef(DRAFT_REF(), fresh);
  pubData = fresh;
  renderAdmin();
  document.getElementById("last-pub-time").textContent = "✅ 已發布 " + new Date().toLocaleTimeString("zh-TW");
};

async function saveDraftLocal() {
  isDirty = true; setDirtyUI();
  document.getElementById("draft-status").textContent = "📝 草稿儲存中...";
  document.getElementById("draft-status").style.color = "#e67e22";
  await writeRef(DRAFT_REF(), draftData);
  document.getElementById("draft-status").textContent = "📝 草稿已儲存 " + new Date().toLocaleTimeString("zh-TW");
  document.getElementById("draft-status").style.color = "#27ae60";
}

function setDirtyUI() {
  document.getElementById("dirty-badge").classList.toggle("hidden", !isDirty);
  document.getElementById("pub-bar").classList.toggle("hidden", !isDirty);
  document.getElementById("pub-btn").style.background = isDirty ? "#e67e22" : "#1a5c38";
}

window.publishDraft = async function() {
  document.getElementById("pub-btn").textContent = "發布中...";
  await writeRef(PUB_REF(), draftData);
  await writeRef(DRAFT_REF(), draftData);
  pubData = JSON.parse(JSON.stringify(draftData));
  isDirty = false; setDirtyUI();
  document.getElementById("pub-btn").textContent = "🚀 Publish";
  document.getElementById("last-pub-time").textContent = "✅ 已發布 " + new Date().toLocaleTimeString("zh-TW");
};

// ── Boot ───────────────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
